<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #18181b;
      --card: #1f1f23;
      --border: #2c2c31;
      --text: #e7e7ea;
      --muted: #8b8b93;
      --accent: #818cf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 440px;
    }
    h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
    p.intro { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-top: 14px;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
    }
    input:focus { outline: 1px solid var(--accent); }
    button {
      margin-top: 20px;
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #18181b;
      font-weight: 600;
      cursor: pointer;
    }
    #saved { margin-top: 10px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <h2>Cursor Usage Tracker — Cài đặt</h2>
  <p class="intro">Endpoint URL lấy từ Network tab ở Phase 0 (xem README.md).</p>

  <label for="endpointUrl">Endpoint URL (cursor.com)</label>
  <input id="endpointUrl" type="text" placeholder="https://cursor.com/api/..." value="https://cursor.com/api/usage-summary"/>

  <label for="serverUrl">Local server URL</label>
  <input id="serverUrl" type="text" placeholder="http://localhost:3333" />

  <label for="user">User label (fallback — chỉ dùng nếu không lấy được email tự động)</label>
  <input id="user" type="text" placeholder="hungfire" />

  <label for="intervalMinutes">Interval (phút, tối thiểu 1)</label>
  <input id="intervalMinutes" type="number" min="1" />

  <button id="save">Lưu</button>
  <div id="saved"></div>

  <script src="options.js"></script>
</body>
</html>
