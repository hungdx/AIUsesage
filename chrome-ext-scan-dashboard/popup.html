<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #18181b;
      --card: #1f1f23;
      --border: #2c2c31;
      --text: #e7e7ea;
      --muted: #8b8b93;
      --accent: #818cf8;
      --ok: #34d399;
      --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 280px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card { padding: 16px; }
    .header {
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    #percent {
      font-size: 32px;
      font-weight: 600;
      line-height: 1.1;
    }
    .muted { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
    .ok { color: var(--ok); }
    .error { color: var(--error); }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 8px 0;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #18181b;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    button.secondary {
      margin-top: 8px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    a#openOptions {
      display: block;
      margin-top: 10px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
    }
    a#openOptions:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">Cursor Usage</div>
    <div id="userLabel" class="muted"></div>
    <div id="percent">--%</div>
    <div id="breakdown" class="muted"></div>
    <div id="reset" class="muted">reset: --</div>
    <div id="status" class="muted"></div>
    <div id="codexStatus" class="muted"></div>
    <button id="fetchNow">Fetch now</button>
    <button id="testToken" class="secondary" type="button">Test Codex token</button>
    <div id="tokenTest" class="muted"></div>
    <a id="openOptions" href="#">Cài đặt</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
