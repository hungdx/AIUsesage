<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Cursor Usage Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #18181b;
      --card: #1f1f23;
      --border: #2c2c31;
      --text: #e7e7ea;
      --muted: #8b8b93;
      --accent: #818cf8;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 4px;
    }
    p.sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
    #cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      max-width: 760px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .user {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .percent { font-size: 30px; font-weight: 600; }
    .muted { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .small { font-size: 11px; margin-top: 10px; }
    .medium { color: var(--text); font-size: 16px; margin-top: 10px; }
    .empty { color: var(--muted); font-size: 13px; }
    .alert {
      color: var(--warn);
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }
    .over-pace {
      border-color: var(--warn);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--warn) 35%, transparent);
    }
  </style>
</head>
<body>
  <h1>Cursor Usage</h1>
  <p class="sub">Tự refresh mỗi 5 giây</p>
  <div id="cards"></div>

  <script>
    async function load() {
      try {
        const res = await fetch("/api/usages");
        const data = await res.json();
        render(data);
      } catch (err) {
        document.getElementById("cards").innerHTML =
          '<p class="empty">Không gọi được /api/usages: ' + err.message + '</p>';
      }
    }

    function render(data) {
      const container = document.getElementById("cards");
      const users = Object.keys(data).sort((a, b) => {
        const remainA = data[a].remainingPercent ?? -1;
        const remainB = data[b].remainingPercent ?? -1;
        return remainB - remainA;
      });

      if (users.length === 0) {
        container.innerHTML = '<p class="empty">Chưa có data. Đợi extension fetch lần đầu (hoặc bấm "Fetch now" trong popup).</p>';
        return;
      }

      container.innerHTML = users
        .map((user) => {
          const d = data[user];
          const reset = d.reset ? new Date(d.reset).toLocaleDateString("vi-VN") : "--";
          const updatedAt = d.updatedAt ? new Date(d.updatedAt).toLocaleString("vi-VN") : "--";
          const cycleStart = d.cycleStart
            ? new Date(d.cycleStart).toLocaleDateString("vi-VN")
            : "--";
          const currentAvg = d.currentAvgPercent != null ? d.currentAvgPercent : "--";
          const allowedAvg = d.allowedAvgPercent != null ? d.allowedAvgPercent : "--";
          const allowedNow = d.allowedPercentNow != null ? d.allowedPercentNow : "--";
          const overPace = d.isOverPace === true;
          return `
            <div class="card${overPace ? " over-pace" : ""}">
              <div class="user">${user}</div>
              <div class="percent">${d.percent ?? "--"}%</div>
              <div class="muted">Auto ${d.autoPercentUsed ?? "--"}% · API ${d.apiPercentUsed ?? "--"}%</div>
              <div class="muted">Reset: ${reset}</div>
              <div class="muted small">Chu kỳ: ${cycleStart} → ${reset}</div>
              <div class="medium">TB hiện tại: ${currentAvg}%/ngày </div>
              <div class="medium">Cho phép: ${allowedAvg}%/ngày </div>
              <div class="muted small">(còn ${d.remainingPercent ?? "--"}% · <span class="alert">${d.remainingDays ?? "--"}</span> ngày, đệm ${d.resetBufferDays ?? 10} ngày)</div>
              <div class="muted small">Mức cho phép đến nay: ${allowedNow}%</div>
              ${overPace ? '<div class="alert">⚠ Đang dùng nhanh hơn mức cho phép</div>' : ""}
              <div class="muted small">Cập nhật: ${updatedAt}</div>
              <br/>
              <a href="https://cursor.com/dashboard/spending" target="_blank">Xem chi tiết</a>
            </div>
          `;
        })
        .join("");
    }

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
